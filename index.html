<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prompt Vault</title>
  <!-- Menggunakan Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Menggunakan Lucide Icons via CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    /* Custom Scrollbar sederhana */
    ::-webkit-scrollbar { height: 6px; width: 6px; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
  </style>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen p-4 md:p-8 font-sans">

  <div class="max-w-6xl mx-auto space-y-8">
    
    <!-- Header -->
    <header class="flex flex-col md:flex-row justify-between items-center gap-4">
      <div>
        <h1 class="text-3xl font-bold bg-gradient-to-r from-blue-500 to-purple-600 bg-clip-text text-transparent">Prompt Vault</h1>
        <p class="text-sm text-gray-500">Kelola dan gunakan AI Prompt Anda dengan cepat.</p>
      </div>
      <div class="flex w-full md:w-auto gap-2">
        <div class="relative w-full md:w-72">
          <i data-lucide="search" class="absolute left-3 top-2.5 w-5 h-5 text-gray-400"></i>
          <input type="text" id="searchInput" placeholder="Cari judul atau tag..." class="w-full pl-10 pr-4 py-2 rounded-lg border border-gray-200 focus:ring-2 focus:ring-blue-500 outline-none" onkeyup="renderPrompts()">
        </div>
        <button onclick="openFormModal()" class="flex items-center gap-2 bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg transition">
          <i data-lucide="plus" class="w-5 h-5"></i> <span class="hidden sm:inline">Tambah</span>
        </button>
      </div>
    </header>

    <!-- Grid Container untuk Prompts -->
    <div id="promptsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <!-- Kartu akan di-render di sini oleh JavaScript -->
    </div>

  </div>

  <!-- Modal Form Tambah/Edit -->
  <div id="formModal" class="hidden fixed inset-0 bg-black/50 items-center justify-center p-4 z-50">
    <div class="bg-white rounded-xl w-full max-w-md p-6 relative">
      <button onclick="closeFormModal()" class="absolute top-4 right-4 text-gray-500"><i data-lucide="x" class="w-5 h-5"></i></button>
      <h2 id="modalTitle" class="text-xl font-bold mb-4">Tambah Prompt Baru</h2>
      <form id="promptForm" onsubmit="savePrompt(event)" class="space-y-4">
        <input type="hidden" id="promptId">
        <div>
          <label class="block text-sm mb-1">Judul</label>
          <input type="text" id="titleInput" required class="w-full border rounded p-2">
        </div>
        <div>
          <label class="block text-sm mb-1">Kategori</label>
          <input type="text" id="categoryInput" required class="w-full border rounded p-2" placeholder="Contoh: Marketing">
        </div>
        <div>
          <label class="block text-sm mb-1">Isi Prompt (Gunakan [Variabel] untuk pop-up)</label>
          <textarea id="contentInput" required rows="4" class="w-full border rounded p-2 font-mono text-sm" placeholder="Buat artikel tentang [Topik]..."></textarea>
        </div>
        <div>
          <label class="block text-sm mb-1">Tags (Pisahkan dengan koma)</label>
          <input type="text" id="tagsInput" class="w-full border rounded p-2" placeholder="seo, artikel">
        </div>
        <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-lg font-medium hover:bg-blue-700">Simpan</button>
      </form>
    </div>
  </div>

  <!-- Modal Variabel -->
  <div id="varModal" class="hidden fixed inset-0 bg-black/60 items-center justify-center p-4 z-50 backdrop-blur-sm">
    <div class="bg-white rounded-xl w-full max-w-md p-6 relative shadow-2xl">
      <button onclick="closeVarModal()" class="absolute top-4 right-4 text-gray-500 hover:text-red-500"><i data-lucide="x" class="w-5 h-5"></i></button>
      <div class="mb-6">
        <h2 class="text-xl font-bold">Lengkapi Prompt</h2>
        <p class="text-sm text-gray-500 mt-1">Isi variabel di bawah untuk menyalin hasil akhir.</p>
      </div>
      <div id="varInputsContainer" class="space-y-4 max-h-[60vh] overflow-y-auto">
        <!-- Input dinamis muncul di sini -->
      </div>
      <div class="mt-8">
        <button onclick="executeVariablePrompt()" class="w-full flex items-center justify-center gap-2 bg-gradient-to-r from-blue-600 to-purple-600 text-white py-3 rounded-lg font-medium hover:from-blue-700 hover:to-purple-700 transition">
          <i data-lucide="copy" class="w-4 h-4"></i> Salin ke Clipboard
        </button>
      </div>
    </div>
  </div>

  <!-- Toast Notifikasi -->
  <div id="toastMsg" class="fixed bottom-6 right-6 bg-gray-900 text-white px-4 py-3 rounded-lg shadow-lg flex items-center gap-2 opacity-0 pointer-events-none transition-opacity duration-300">
    <i data-lucide="check" class="w-5 h-5 text-green-400"></i> <span id="toastText">Berhasil!</span>
  </div>

  <!-- Script Logika -->
  <script>
    // Data Default (Termasuk contoh untuk jualan)
    const defaultPrompts = [
      {
        id: Date.now().toString(),
        title: "Promo Sosial Media",
        category: "Marketing",
        tags: ["promo", "sosmed"],
        content: "Buatkan caption [Platform] yang menarik untuk mempromosikan paket kuota internet sebesar [Jumlah GB] GB dengan harga [Harga]. Gunakan gaya bahasa yang persuasif dan santai. Sertakan juga call to action untuk menghubungi via WhatsApp."
      }
    ];

    let prompts = JSON.parse(localStorage.getItem('prompts')) || defaultPrompts;
    let activePrompt = null;
    let extractedVars = [];

    // Fungsi Render UI
    function renderPrompts() {
      const grid = document.getElementById('promptsGrid');
      const searchQuery = document.getElementById('searchInput').value.toLowerCase();
      
      const filtered = prompts.filter(p => 
        p.title.toLowerCase().includes(searchQuery) || 
        p.tags.some(t => t.toLowerCase().includes(searchQuery))
      );

      grid.innerHTML = filtered.length === 0 
        ? `<div class="col-span-full text-center py-12 text-gray-500">Tidak ada prompt ditemukan.</div>` 
        : filtered.map(p => `
          <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-5 flex flex-col justify-between hover:shadow-md transition">
            <div>
              <div class="flex justify-between items-start mb-3">
                <h3 class="font-semibold text-lg line-clamp-1">${p.title}</h3>
                <span class="text-xs px-2 py-1 bg-gray-100 rounded text-gray-500">${p.category}</span>
              </div>
              <p class="text-sm text-gray-600 line-clamp-3 mb-4 font-mono bg-gray-50 p-2 rounded border">${p.content.replace(/</g, "&lt;")}</p>
              <div class="flex flex-wrap gap-1 mb-4">
                ${p.tags.map(tag => `<span class="text-xs text-blue-600 bg-blue-50 px-2 py-0.5 rounded-full">#${tag}</span>`).join('')}
              </div>
            </div>
            <div class="flex justify-between items-center pt-4 border-t">
              <div class="flex gap-2">
                <button onclick="editPrompt('${p.id}')" class="p-1.5 text-gray-400 hover:text-blue-500"><i data-lucide="edit" class="w-4 h-4"></i></button>
                <button onclick="deletePrompt('${p.id}')" class="p-1.5 text-gray-400 hover:text-red-500"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
              </div>
              <div class="flex gap-2">
                <button onclick="copyText('${p.content.replace(/'/g, "\\'")}')" class="p-1.5 text-gray-500 hover:text-gray-900"><i data-lucide="copy" class="w-5 h-5"></i></button>
                <button onclick="usePrompt('${p.id}')" class="flex items-center gap-1 bg-gray-900 text-white px-3 py-1.5 rounded-lg text-sm hover:bg-gray-800"><i data-lucide="play" class="w-4 h-4"></i> Gunakan</button>
              </div>
            </div>
          </div>
        `).join('');
      
      lucide.createIcons(); // Render ulang ikon baru
    }

    // CRUD Logic
    function savePrompt(e) {
      e.preventDefault();
      const id = document.getElementById('promptId').value;
      const tagsRaw = document.getElementById('tagsInput').value;
      
      const newPrompt = {
        id: id || Date.now().toString(),
        title: document.getElementById('titleInput').value,
        category: document.getElementById('categoryInput').value || 'Uncategorized',
        content: document.getElementById('contentInput').value,
        tags: tagsRaw.split(',').map(t => t.trim()).filter(t => t)
      };

      if (id) {
        prompts = prompts.map(p => p.id === id ? newPrompt : p);
      } else {
        prompts.unshift(newPrompt);
      }

      localStorage.setItem('prompts', JSON.stringify(prompts));
      closeFormModal();
      renderPrompts();
    }

    function deletePrompt(id) {
      if (confirm("Hapus prompt ini?")) {
        prompts = prompts.filter(p => p.id !== id);
        localStorage.setItem('prompts', JSON.stringify(prompts));
        renderPrompts();
      }
    }

    function editPrompt(id) {
      const p = prompts.find(x => x.id === id);
      document.getElementById('promptId').value = p.id;
      document.getElementById('titleInput').value = p.title;
      document.getElementById('categoryInput').value = p.category;
      document.getElementById('contentInput').value = p.content;
      document.getElementById('tagsInput').value = p.tags.join(', ');
      
      document.getElementById('modalTitle').innerText = "Edit Prompt";
      document.getElementById('formModal').classList.replace('hidden', 'flex');
    }

    // Fitur Variabel & Copy
    function usePrompt(id) {
      activePrompt = prompts.find(p => p.id === id);
      const matches = [...activePrompt.content.matchAll(/\[(.*?)\]/g)].map(m => m[1]);
      extractedVars = [...new Set(matches)]; // Hapus duplikat

      if (extractedVars.length > 0) {
        const container = document.getElementById('varInputsContainer');
        container.innerHTML = extractedVars.map(v => `
          <div>
            <label class="block text-sm font-medium mb-1 text-gray-700">${v}</label>
            <input type="text" id="var_${v}" class="w-full border rounded-lg p-2 focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Masukkan ${v.toLowerCase()}...">
          </div>
        `).join('');
        document.getElementById('varModal').classList.replace('hidden', 'flex');
      } else {
        copyText(activePrompt.content);
      }
    }

    function executeVariablePrompt() {
      let finalContent = activePrompt.content;
      extractedVars.forEach(v => {
        const val = document.getElementById(`var_${v}`).value || "";
        finalContent = finalContent.replace(new RegExp(`\\[${v}\\]`, "g"), val);
      });
      copyText(finalContent);
      closeVarModal();
    }

    function copyText(text) {
      navigator.clipboard.writeText(text);
      showToast("Prompt berhasil disalin!");
    }

    // UI Helpers
    function openFormModal() {
      document.getElementById('promptForm').reset();
      document.getElementById('promptId').value = "";
      document.getElementById('modalTitle').innerText = "Tambah Prompt Baru";
      document.getElementById('formModal').classList.replace('hidden', 'flex');
    }
    function closeFormModal() { document.getElementById('formModal').classList.replace('flex', 'hidden'); }
    function closeVarModal() { document.getElementById('varModal').classList.replace('flex', 'hidden'); }
    function showToast(msg) {
      const toast = document.getElementById('toastMsg');
      document.getElementById('toastText').innerText = msg;
      toast.classList.replace('opacity-0', 'opacity-100');
      setTimeout(() => toast.classList.replace('opacity-100', 'opacity-0'), 2500);
    }

    // Inisialisasi awal
    renderPrompts();
  </script>
</body>
</html>
